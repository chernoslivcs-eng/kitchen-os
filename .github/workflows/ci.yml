name: CI

on:
  push:
    # retail/** — довга робоча гілка M13 (Сільпо): Postgres-контракт мусить
    # ганятись на кожен пуш, не тільки при мерджі в main.
    branches: [main, 'retail/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Самодостатній Postgres у контейнері: жодних зовнішніх секретів і мертвих
    # Neon-бранчів (PG_TEST_URL-секрет протух і валив кожен пуш «за 22 секунди»).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kitchen
          POSTGRES_PASSWORD: kitchen
          POSTGRES_DB: kitchen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kitchen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: postgresql://kitchen:kitchen@localhost:5432/kitchen_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate test database
        run: pnpm --filter @kitchen/db migrate
        env:
          PG_URL: postgresql://kitchen:kitchen@localhost:5432/kitchen_test

      - name: Run tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck
