name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PG_TEST_URL: ${{ secrets.PG_TEST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate test database (Neon dev branch)
        run: pnpm --filter @kitchen/db migrate
        env:
          PG_URL: ${{ secrets.PG_TEST_URL }}

      - name: Run tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck
