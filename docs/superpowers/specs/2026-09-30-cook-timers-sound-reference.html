<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кукінг-мод · еталон звуку</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  button { font: inherit; padding: 8px 14px; cursor: pointer; }
  #clk { font: 600 28px ui-monospace, monospace; }
  #ph { color: #666; }
</style>
</head>
<body>
<h1>Кукінг-мод · еталон звуку (спек 2026-09-30)</h1>
<p>Те, що затвердив власник 30.09: набір «Заводний таймер», темп 120, сценарій «Тихий пульс».
Функції <code>tick</code>, <code>five</code>, <code>minute</code>, <code>alarm</code>, <code>second</code> і <code>plan</code> — еталон для перенесення в застосунок.</p>
<div class="row">
  <button data-k="pulse">Пульс · 4 с</button>
  <button data-k="five">5 секунд</button>
  <button data-k="minute">Хвилина</button>
  <button data-k="alarm">Аларм</button>
</div>
<div class="row">
  <button id="play">У дії · 27 с</button>
  <button id="stop">Стоп</button>
</div>
<p><span id="clk">3:00</span> <span id="ph"></span></p>
<script>
// Гучність проби, на якій слухав власник.
const MASTER = 0.7;

let ctx = null, master = null, timers = [];
function ac() {
  if (!ctx || ctx.state === 'closed') {
    const C = window.AudioContext || window.webkitAudioContext;
    ctx = new C();
    master = ctx.createGain(); master.gain.value = MASTER; master.connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx.currentTime + 0.04;
}

// Синус із миттєвою атакою (3 мс) і експоненційним спадом за d секунд.
function tone(t, f, g, d) {
  const o = ctx.createOscillator(), a = ctx.createGain();
  o.frequency.value = f;
  a.gain.setValueAtTime(0.0001, t);
  a.gain.exponentialRampToValueAtTime(g, t + 0.003);
  a.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(a).connect(master); o.start(t); o.stop(t + d + 0.05);
}
// Клац механізму: білий шум довжиною d із кубічним спадом крізь смуговий фільтр.
function click(t, f, q, g, d) {
  const n = Math.ceil(ctx.sampleRate * d), b = ctx.createBuffer(1, n, ctx.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const s = ctx.createBufferSource(); s.buffer = b;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
  const a = ctx.createGain(); a.gain.value = g;
  s.connect(bp).connect(a).connect(master); s.start(t);
}
// Дзвоник: три негармонійні обертони, вищі гаснуть швидше.
const PARTIALS = [1, 2.4, 3.9], PARTIAL_GAIN = [1, 0.5, 0.22];
function bell(t, base, d, g) { PARTIALS.forEach((r, i) => tone(t, base * r, g * PARTIAL_GAIN[i], d / (1 + i * 0.7))); }

// Сила тіку: 0 сильний, 1 середній, 2 легкий, 3 підстук.
// [частота клацу, гучність клацу, частота тону, гучність тону, довжина клацу]
const LEVEL = [
  [3500, 0.95, 4300, 0.024, 0.012],
  [3150, 0.72, 3900, 0.017, 0.011],
  [2950, 0.50, 3700, 0.011, 0.010],
  [3900, 0.28, 4600, 0.006, 0.008],
];
function tick(t, level, m) { const v = LEVEL[level]; click(t, v[0], 7, v[1] * m, v[4]); tone(t, v[2], v[3] * m, 0.022); }
function five(t, m) { click(t, 2500, 6, 1.25 * m, 0.017); tone(t, 2900, 0.05 * m, 0.06); }
function minute(t, m) {
  click(t, 1900, 5, 1.7 * m, 0.022); tone(t, 2200, 0.06 * m, 0.07);
  click(t + 0.125, 2600, 6, 1.35 * m, 0.017); tone(t + 0.125, 3000, 0.045 * m, 0.06);
}
// Аларм: 26 ударів молоточка кожні 52 мс (≈1,35 с) і відзвук 1,3 с.
function alarm(t) {
  for (let i = 0; i < 26; i++) {
    const e = i < 3 ? 0.6 + i * 0.13 : 1 - Math.max(0, i - 18) * 0.09;
    click(t + i * 0.052, 3800, 5, 0.35 * e, 0.01);
    bell(t + i * 0.052, 2093, 0.16, 0.085 * e);
  }
  bell(t + 26 * 0.052, 2093, 1.3, 0.09);
}

// Малюнки секунди: [зсув від початку секунди в секундах, сила]. Темп 120 = дві долі на секунду.
const PULSE = [[0, 2], [5 / 6, 3]];
const SWING = [[0, 0], [1 / 3, 2], [0.5, 1], [5 / 6, 2]];
const GALOP = [[0, 0], [0.25, 2], [0.375, 3], [0.5, 1], [0.75, 2], [0.875, 3]];

// Голова секунди: акцент хвилини або пʼяти секунд замінює перший тік малюнка.
function headOf(left) { return left % 60 === 0 ? 'minute' : left % 5 === 0 ? 'five' : 'tick'; }

// Сценарій «Тихий пульс»: left — секунд лишилось на початку цієї секунди (те, що на екрані).
function plan(left) {
  if (left > 10) return { pattern: PULSE, head: headOf(left), m: 0.7, name: 'тихий пульс' };
  if (left > 3) return { pattern: SWING, head: headOf(left), m: 1, name: 'свінг' };
  return { pattern: GALOP, head: 'tick', m: 1, name: 'галоп' };
}
function second(t, p) {
  if (p.head === 'minute') minute(t, p.m); else if (p.head === 'five') five(t, p.m);
  p.pattern.forEach(([o, level]) => {
    if (o === 0) { if (p.head === 'tick') tick(t, level, p.m); }
    else tick(t + o, level, p.m);
  });
}

const clk = document.getElementById('clk'), ph = document.getElementById('ph');
const fmt = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function stopAll() {
  timers.forEach(clearTimeout); timers = []; clk.textContent = '3:00'; ph.textContent = '';
  if (ctx && ctx.state !== 'closed') ctx.close(); ctx = null;
}
document.querySelectorAll('button[data-k]').forEach((b) => b.addEventListener('click', () => {
  stopAll(); const t = ac(), k = b.dataset.k;
  if (k === 'pulse') for (let s = 0; s < 4; s++) second(t + s, plan(64 - s));
  else if (k === 'five') { second(t, plan(66)); second(t + 1, plan(65)); second(t + 2, plan(64)); }
  else if (k === 'minute') { second(t, plan(121)); second(t + 1, plan(120)); second(t + 2, plan(119)); }
  else alarm(t);
}));
document.getElementById('stop').addEventListener('click', stopAll);
document.getElementById('play').addEventListener('click', () => {
  stopAll(); const t0 = ac(), seq = [];
  [[180, 177], [122, 118], [62, 58], [12, 0]].forEach(([a, b]) => { for (let s = a; s >= b; s--) seq.push(s); });
  seq.forEach((left, i) => {
    const at = t0 + i; let name = 'аларм';
    if (left === 0) alarm(at); else { const p = plan(left); second(at, p); name = p.name; }
    timers.push(setTimeout(() => { clk.textContent = left === 0 ? 'час' : fmt(left); ph.textContent = name; }, i * 1000 + 40));
  });
});
</script>
</body>
</html>
